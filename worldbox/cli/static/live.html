<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldbox</title>
<style>
:root{
  --bg:#06090A; --panel:#0E1513; --panel2:#16201C; --panel3:#1D2924; --line:#26332D; --line2:#33443B;
  --ink:#ECF1EA; --ink2:#A3AEA4; --ink3:#6E7A71;
  --accent:#6FD3C4; --accent2:#0F3A36;
  --war:#EE7655; --plague:#B994E6; --invention:#E8BC52; --society:#6DCB8E;
  --birth:#8FA394; --death:#6E7A71; --milestone:#6FD3C4; --mind:#86BCFF; --system:#A3AEA4;
  --good:#6DCB8E; --warn:#E8BC52; --bad:#EE7655;
  --ds:#4EC8C0; --oa:#E8B84A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:7px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:var(--ui);font-size:12px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s}
button:hover{background:var(--panel3);border-color:var(--line2)}
button.on{background:var(--accent2);border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{font-family:var(--ui);font-size:12px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
input[type=range]{padding:0;border:none;background:none;accent-color:var(--accent);height:18px}
label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);margin:9px 0 4px}
.hint{color:var(--ink3);font-style:italic}
.mono{font-family:var(--mono)}

#stage{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.grabbing{cursor:grabbing}
#map.tool{cursor:crosshair}

.panel{position:fixed;background:linear-gradient(180deg,rgba(20,29,25,.95),rgba(13,19,17,.95));
  border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);
  box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.035)}
.hd{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink3);padding:8px 11px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd button{padding:2px 7px;font-size:10.5px;line-height:1.3}

/* ---------- top HUD ---------- */
#top{top:10px;left:10px;right:10px;display:flex;align-items:center;gap:12px;padding:6px 10px;height:50px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;
  letter-spacing:.24em;text-transform:uppercase;padding-right:10px;border-right:1px solid var(--line)}
.date{display:flex;flex-direction:column;line-height:1.15;min-width:118px}
.date b{font-family:var(--mono);font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.date span{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em}
.era{display:inline-block;margin-top:1px;color:var(--invention)!important}
.stats{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px 4px 6px;height:36px;white-space:nowrap}
.chip img{width:18px;height:18px}
.chip .v{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.chip .l{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);line-height:1}
.chip .col{display:flex;flex-direction:column;gap:3px}
.chip .d{font-family:var(--mono);font-size:9.5px;margin-left:2px}
.chip .d.up{color:var(--good)} .chip .d.dn{color:var(--bad)}
.chip.alert{border-color:#6B3426;background:#2A1712}
.chip.alert .v{color:var(--war)}
.chip.sick{border-color:#4A3866;background:#1E1729}
.chip.sick .v{color:var(--plague)}
.meter{width:74px;height:6px;background:#1A231F;border-radius:3px;overflow:hidden;margin-top:1px}
.meter i{display:block;height:100%;border-radius:3px;transition:width .4s,background .4s}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px}
.seg{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{border:none;background:none;padding:5px 9px;font-family:var(--mono);font-size:11px;color:var(--ink2);border-radius:4px}
.seg button:hover{background:var(--panel3);color:var(--ink)}
.seg button.on{background:var(--accent2);color:var(--accent)}
.seg span{font-family:var(--mono);font-size:11px;color:var(--ink2);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
#playBtn{width:38px;height:36px;padding:0;font-size:13px;display:flex;align-items:center;justify-content:center}
#playBtn.paused{background:#2D2410;border-color:#7A5E1E;color:var(--invention)}
#aiBtn{height:36px;padding:0 11px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  background:rgba(134,188,255,.10);border-color:#2F4A6E;color:var(--mind)}
#aiBtn.off{background:var(--panel2);border-color:var(--line);color:var(--ink3);text-decoration:line-through}
#aiBtn.none{opacity:.45}
.aictl{display:flex;align-items:center;gap:6px;margin-top:7px}
.aictl button{padding:2px 8px;font-family:var(--mono);font-size:10.5px}

/* ---------- left toolbar ---------- */
#tools{top:70px;left:10px;width:58px;padding:6px;display:flex;flex-direction:column;gap:4px}
.tgl{font-family:var(--mono);font-size:7.5px;letter-spacing:.14em;color:var(--ink3);text-align:center;
  text-transform:uppercase;margin:4px 0 1px}
.tb{width:44px;height:44px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tb img{width:18px;height:18px}
.tb .lbl{font-family:var(--mono);font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.tb.on .lbl{color:var(--accent)}
.tb .key{position:absolute;top:2px;right:4px;font-family:var(--mono);font-size:7.5px;color:var(--ink3)}
.sep{height:1px;background:var(--line);margin:3px 2px}

#drawer{top:70px;left:76px;width:236px;display:none}
#drawer.show{display:block}
#drawer .body{padding:10px 12px 12px}
#drawer .title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
#drawer .title img{width:27px;height:27px}
#drawer .desc{color:var(--ink2);font-size:12px;line-height:1.45;margin:6px 0 2px}
.rowline{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.rowline input{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.kbd{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink2)}

/* ---------- right panel (tabs) ---------- */
#right{top:70px;right:10px;width:310px;bottom:126px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:4px 4px 0;gap:2px}
.tab{flex:1;border:none;background:none;border-radius:5px 5px 0 0;padding:7px 2px 8px;font-family:var(--mono);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);position:relative;border-bottom:2px solid transparent}
.tab:hover{background:var(--panel2);color:var(--ink2)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);background:transparent}
.tab .n{display:inline-block;min-width:14px;margin-left:3px;padding:0 3px;border-radius:7px;background:var(--panel3);color:var(--ink2);font-size:8.5px}
.tab .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:3px;background:var(--invention);display:none}
.tab .dot.show{display:block}
.pane{display:none;padding:10px 12px;overflow-y:auto;flex:1;font-size:12.5px}
.pane.on{display:block}
.pane::-webkit-scrollbar,#logBody::-webkit-scrollbar{width:8px}
.pane::-webkit-scrollbar-thumb,#logBody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--line2);background:var(--panel3)}
.ttl{display:flex;align-items:center;gap:7px}
.ttl .name{font-weight:600;font-size:13px}
.strip{width:4px;align-self:stretch;border-radius:2px;flex:none}
.sub{color:var(--ink3);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.meta{color:var(--ink2);font-family:var(--mono);font-size:10.5px;margin-top:3px}
h3{margin:0;font-size:16px}
.kv{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;padding:2px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--ink2)}
.bar{height:5px;background:#1A231F;border-radius:3px;margin:3px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.tags{margin-top:7px;font-family:var(--mono);font-size:10px;color:var(--ink3);line-height:1.6}
.quote{margin-top:7px;padding:6px 8px;border-left:2px solid var(--mind);background:rgba(134,188,255,.06);color:var(--ink2);font-size:12px;line-height:1.45;border-radius:0 4px 4px 0}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.role{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 2px}
.role img{width:18px;height:22px}
.role b{font-family:var(--mono);font-size:12px}
.role span{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.person{display:flex;gap:8px;margin:0 0 8px;font-family:var(--mono);font-size:11px;line-height:1.45;color:var(--ink2)}
.person img{width:27px;height:33px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px}
.person .nm{color:var(--ink);font-family:var(--ui);font-size:12.5px;font-weight:600}
.person .info{flex:1;min-width:0}
.section{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:12px 0 6px}
.badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line2);border-radius:3px;padding:0 5px;margin-left:4px;color:var(--ink2);vertical-align:1px}
.badge.ds{color:var(--ds);border-color:#1C5C58}
.badge.oa{color:var(--oa);border-color:#6A5420}
.badge.chief{color:var(--invention);border-color:#6A5420}
.badge.ill{color:var(--plague);border-color:#4A3866}
.stance{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:1px 6px;border-radius:3px;background:rgba(134,188,255,.12);color:var(--mind)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.empty{text-align:center;padding:14px 6px;color:var(--ink3)}
.empty .big{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.prose p{margin:0 0 9px;line-height:1.55;color:var(--ink2)}
.disc .name{color:var(--invention);font-weight:600}
.disc .why{color:var(--ink2);font-size:12px;margin-top:3px;line-height:1.4}

/* ---------- extension chat panels ---------- */
.pane.chatpane.on{display:flex;flex-direction:column;padding:0}
.chatlog{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.msg .who{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.msg.player{align-self:flex-end;background:var(--accent2);border:1px solid #1F5A54;color:var(--ink)}
.msg.character{align-self:flex-start;background:var(--panel2);border:1px solid var(--line2)}
.msg.system{align-self:center;background:none;color:var(--ink3);font-style:italic;font-size:11.5px;text-align:center}
.msg.pending{opacity:.65}
.chatsub{padding:8px 12px 0;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.chatin{display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.chatin input{flex:1}
.chatin button{flex:none}

/* ---------- log ---------- */
#log{bottom:10px;left:10px;width:470px;max-width:calc(100vw - 230px)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.flt{padding:1px 6px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;border-radius:10px;
  background:none;color:var(--ink3);border:1px solid var(--line)}
.flt.on{color:var(--ink);border-color:var(--line2);background:var(--panel3)}
.flt i{display:inline-block;width:6px;height:6px;border-radius:3px;margin-right:4px;vertical-align:0}
#logBody{height:150px;overflow-y:auto;padding:6px 10px;margin:0;list-style:none;font-family:var(--mono);font-size:11px;line-height:1.6}
#logBody li{display:flex;gap:8px;align-items:baseline}
#logBody li i{flex:none;width:6px;height:6px;border-radius:3px;margin-top:5px}
#logBody .d{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink3);min-width:58px}
#logBody .m{color:var(--ink2)}
#log.collapsed #logBody{display:none}

/* ---------- minimap ---------- */
#mini{bottom:10px;right:10px;padding:6px;width:310px}
#mini canvas{display:block;width:100%;border-radius:4px;cursor:pointer}
#mini .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink3);margin:0 2px 5px}

/* ---------- tooltip + toasts ---------- */
#tip{position:fixed;pointer-events:none;background:rgba(6,9,10,.96);border:1px solid var(--line2);border-radius:5px;
  padding:5px 8px;font-family:var(--mono);font-size:11px;color:var(--ink2);display:none;z-index:50;white-space:nowrap}
#tip b{color:var(--ink)}
#toasts{position:fixed;top:72px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:rgba(14,21,19,.97);border:1px solid var(--line2);border-left:3px solid var(--accent);
  border-radius:6px;padding:8px 14px 8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;max-width:520px;
  animation:tin .25s ease-out}
.toast img{width:18px;height:18px}
.toast .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.toast.out{opacity:0;transform:translateY(-6px);transition:opacity .4s,transform .4s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (max-width:1100px){.chip .l{display:none}.date{min-width:96px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<div id="stage"><canvas id="map"></canvas></div>
<div id="tip"></div>
<div id="toasts"></div>

<header class="panel" id="top">
  <div class="brand"><img class="px" id="logo" alt="" width="18" height="18"><span>Worldbox</span></div>
  <div class="date"><b id="year">Year 0</b><span id="dayOf">day 0</span><span class="era" id="era"></span></div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="ctl">
    <button id="aiBtn" title="LLM calls on/off while the world runs (M)">AI</button>
    <button id="playBtn" title="Pause / resume (Space)">❚❚</button>
    <div class="seg" id="speeds" title="Simulation speed ( [ and ] )">
      <button data-delay="0.25">½×</button><button class="on" data-delay="0.06">1×</button>
      <button data-delay="0.01">4×</button><button data-delay="0">Max</button>
      <span id="rate" title="Days actually simulated per second">–</span>
    </div>
    <div class="seg" title="Zoom (scroll, + / -, F to fit)">
      <button id="zoomOut">−</button><span id="zlabel">1.0×</span><button id="zoomIn">+</button><button id="fit">Fit</button>
    </div>
  </div>
</header>

<nav class="panel" id="tools">
  <div class="tgl">View</div>
  <button class="tb lyr on" data-layer="none" data-ico="terrain" title="Terrain (L cycles layers)"><img class="px" alt=""><span class="lbl">Land</span></button>
  <button class="tb lyr" data-layer="territory" data-ico="flag" title="Territory — who holds the ground"><img class="px" alt=""><span class="lbl">Realm</span></button>
  <button class="tb lyr" data-layer="fertility" data-ico="wheat" title="Farmland — cultivated soil"><img class="px" alt=""><span class="lbl">Farm</span></button>
  <button class="tb lyr" data-layer="food" data-ico="apple" title="Wild food on the ground"><img class="px" alt=""><span class="lbl">Food</span></button>
  <div class="sep"></div>
  <div class="tgl">Powers</div>
  <button class="tb tl" data-tool="spawn" data-ico="spawn" data-k="1"><img class="px" alt=""><span class="lbl">Spawn</span><span class="key">1</span></button>
  <button class="tb tl" data-tool="bless" data-ico="sun" data-k="2"><img class="px" alt=""><span class="lbl">Bless</span><span class="key">2</span></button>
  <button class="tb tl" data-tool="blight" data-ico="blight" data-k="3"><img class="px" alt=""><span class="lbl">Blight</span><span class="key">3</span></button>
  <button class="tb tl" data-tool="smite" data-ico="bolt" data-k="4"><img class="px" alt=""><span class="lbl">Smite</span><span class="key">4</span></button>
  <button class="tb tl" data-tool="plague" data-ico="skull" data-k="5"><img class="px" alt=""><span class="lbl">Plague</span><span class="key">5</span></button>
  <button class="tb tl" data-tool="heal" data-ico="cross" data-k="6"><img class="px" alt=""><span class="lbl">Heal</span><span class="key">6</span></button>
  <div class="sep"></div>
  <button class="tb" id="plantCiv" data-ico="castle" title="Found a civilisation (N)"><img class="px" alt=""><span class="lbl">Found</span><span class="key">N</span></button>
</nav>

<div class="panel" id="drawer"><div class="body">
  <div class="title"><img class="px" id="drawIco" alt=""><span id="drawName"></span></div>
  <div class="desc" id="drawDesc"></div>
  <div id="drawRadius">
    <div class="rowline">Radius <input type="range" id="radius" min="1" max="10" value="3"><span id="rlabel">3</span></div>
  </div>
  <div id="drawFound" style="display:none">
    <label for="civName">Name</label>
    <input id="civName" placeholder="Ashen Kin" maxlength="40">
    <label for="civHouse">Played by</label>
    <select id="civHouse"><option value="mix">Mixed models</option></select>
    <label for="civPeople">Founders <span id="plabel">10</span></label>
    <input type="range" id="civPeople" min="6" max="18" value="10">
  </div>
  <div class="rowline"><span>Click the map to use · <span class="kbd">Esc</span> cancels</span></div>
</div></div>

<aside class="panel" id="right">
  <div class="tabs">
    <button class="tab on" data-pane="insp">Inspect</button>
    <button class="tab" data-pane="civs">Civs<span class="n" id="nCivs">0</span></button>
    <button class="tab" data-pane="minds">Minds<span class="dot" id="dotMinds"></span></button>
    <button class="tab" data-pane="disc">Tech<span class="dot" id="dotDisc"></span></button>
    <button class="tab" data-pane="hist">History</button>
  </div>
  <div class="pane on" id="insp"></div>
  <div class="pane" id="civs"></div>
  <div class="pane" id="minds"></div>
  <div class="pane" id="disc"></div>
  <div class="pane" id="hist">
    <div class="empty"><div class="big">The chronicle, in prose.</div>
      Ask the AI historian to write up what has happened so far.<br><br>
      <button id="explain">Write the history</button></div>
    <div class="prose" id="aiBody"></div>
  </div>
</aside>

<div class="panel" id="log">
  <div class="hd"><span>Events</span><span class="filters" id="filters"></span><button id="logToggle">hide</button></div>
  <ul id="logBody"></ul>
</div>

  /* With the drawn sheet, tiles come from terrain.png (rows: shallow, mid,
     deep water, grass, forest, mountain; 3 variations, 2 frames). It has no
     transitions, so beaches and foam are still drawn on top here. */
  var TP=null;
  if(ART.ok){var tc=document.createElement("canvas");tc.width=ART.img.terrain.width;tc.height=ART.img.terrain.height;
    var tg=tc.getContext("2d");tg.drawImage(ART.img.terrain,0,0);TP=tg.getImageData(0,0,tc.width,tc.height)}
  for(var f=0;f<2;f++){
    var e=document.createElement("canvas");e.width=W*T;e.height=H*T;
    var g=e.getContext("2d"),img=g.createImageData(W*T,H*T),D=img.data;
    var put=function(px,py,c){var i=(py*W*T+px)*4;D[i]=c[0];D[i+1]=c[1];D[i+2]=c[2];D[i+3]=255};
    var foam=function(tx,ty,bx,by){[[0,-1],[0,1],[-1,0],[1,0]].forEach(function(sd,si){if(code(tx+sd[0],ty+sd[1])<=0)return;
      for(var i=0;i<T;i++){if((i+f+si)%3===0)continue;
        put(bx+(sd[0]===0?i:(sd[0]<0?0:T-1)),by+(sd[1]===0?i:(sd[1]<0?0:T-1)),C.foam)}})};
    var beach=function(tx,ty,bx,by){[[0,-1],[0,1],[-1,0],[1,0]].forEach(function(sd){if(code(tx+sd[0],ty+sd[1])!==0)return;
      for(var i=0;i<T;i++)for(var j=0;j<2;j++){
        var sx=sd[0]===0?i:(sd[0]<0?j:T-1-j),sy=sd[1]===0?i:(sd[1]<0?j:T-1-j);
        put(bx+sx,by+sy,j===0?C.sand:(hash(bx+sx,by+sy,7)<.5?C.sand:C.sand2))}})};
    for(var ty=0;ty<H;ty++)for(var tx=0;tx<W;tx++){
      var k=+terrain[ty][tx],bx=tx*T,by=ty*T,u,v,n;
      if(TP){
        var dpt=depth[ty][tx],row=k===0?(dpt<=1?0:dpt===2?1:2):k===1?3:k===2?4:5;
        var vc=Math.floor(hash(tx,ty,5)*3)+(f?3:0);
        for(v=0;v<T;v++)for(u=0;u<T;u++){var si=((row*T+v)*TP.width+(vc*T+u))*4;
          put(bx+u,by+v,[TP.data[si],TP.data[si+1],TP.data[si+2]])}
        if(k===0)foam(tx,ty,bx,by);else if(k===1||k===2)beach(tx,ty,bx,by);
        continue;
      }
      if(k===0){
        var dp=depth[ty][tx],base=dp<=1?C.shal:dp===2?C.mid:C.deep,lit=lift(base,14);
        for(v=0;v<T;v++)for(u=0;u<T;u++){n=hash(bx+u,by+v,3);put(bx+u,by+v,n<.025?lit:base)}
        if(hash(tx,ty,10)<.38){
          var wy=1+Math.floor(hash(tx,ty,20)*6),wx=Math.floor(hash(tx,ty,30)*4)+(f?1:0);
          for(u=0;u<3;u++)if(wx+u<T)put(bx+wx+u,by+wy,lift(base,u===1?26:18))}
        var sides=[[0,-1],[0,1],[-1,0],[1,0]];
        sides.forEach(function(sd,si){ if(code(tx+sd[0],ty+sd[1])<=0)return;
          for(var i=0;i<T;i++){ if((i+f+si)%3===0)continue;
            var fx=sd[0]===0?i:(sd[0]<0?0:T-1),fy=sd[1]===0?i:(sd[1]<0?0:T-1);
            put(bx+fx,by+fy,C.foam)}});
      }else if(k===1||k===2){
        for(v=0;v<T;v++)for(u=0;u<T;u++){n=hash(bx+u,by+v,1);
          var gc=k===2?(n<.22?C.ff2:C.ff):(n<.16?C.gr2:n<.26?C.gr3:C.gr);put(bx+u,by+v,gc)}
        if(k===1){
          for(var t2=0;t2<2;t2++){var gx=1+Math.floor(hash(tx,ty,40+t2)*6),gy=2+Math.floor(hash(tx,ty,50+t2)*5);
            put(bx+gx,by+gy,C.tuft);put(bx+gx,by+gy-1,C.tuft);put(bx+gx+1,by+gy,C.gr3)}
          if(hash(tx,ty,60)<.1){var fx2=1+Math.floor(hash(tx,ty,61)*6),fy2=1+Math.floor(hash(tx,ty,62)*6);
            put(bx+fx2,by+fy2,hash(tx,ty,63)<.5?C.fl1:C.fl2)}
        }
        [[0,-1],[0,1],[-1,0],[1,0]].forEach(function(sd){ if(code(tx+sd[0],ty+sd[1])!==0)return;
          for(var i=0;i<T;i++)for(var j=0;j<2;j++){
            var sx=sd[0]===0?i:(sd[0]<0?j:T-1-j),sy=sd[1]===0?i:(sd[1]<0?j:T-1-j);
            put(bx+sx,by+sy,j===0?C.sand:(hash(bx+sx,by+sy,7)<.5?C.sand:C.sand2))}});
        if(k===2){
          var conifer=hash(tx,ty,70)<.5,ox2=Math.floor(hash(tx,ty,71)*2)-0,oy2=Math.floor(hash(tx,ty,72)*2)-1;
          var P=conifer?["...dd...","..dLLd..","..dLld..",".dLLLLd.",".dLLlLd.","dLLLLLLd","...tt...","...tt..."]
                       :["..dLLd..",".dLLlLd.","dLLlLLLd","dLLLLLLd",".dLLLLd.","..dttd..","...tt...","........"];
          for(v=0;v<8;v++)for(u=0;u<8;u++){var ch=P[v][u];if(ch===".")continue;
            var px2=bx+u+ox2,py2=by+v+oy2;if(px2<bx||px2>=bx+T||py2<by||py2>=by+T)continue;
            put(px2,py2,ch==="d"?C.ld:ch==="L"?C.lf:ch==="l"?C.ll:C.trunk)}
        }
      }else{
        for(v=0;v<T;v++)for(u=0;u<T;u++){n=hash(bx+u,by+v,2);put(bx+u,by+v,n<.2?C.rk2:n<.3?C.rkd:C.rk)}
        var interior=code(tx-1,ty)===3&&code(tx+1,ty)===3&&code(tx,ty-1)===3&&code(tx,ty+1)===3;
        var roll=hash(tx,ty,81);
        if(!interior&&roll<.3){
          for(var bo=0;bo<2;bo++){var bxx=1+Math.floor(hash(tx,ty,90+bo)*5),byy=3+Math.floor(hash(tx,ty,95+bo)*4);
            put(bx+bxx,by+byy,C.rkl);put(bx+bxx+1,by+byy,C.rk2);put(bx+bxx,by+byy+1,C.rk2);put(bx+bxx+1,by+byy+1,C.rkd)}
        }else{
          var hgt=interior?(roll<.5?6:5):(roll<.7?3:4),cx=2+Math.floor(hash(tx,ty,80)*4),snowy=interior&&roll<.6;
          for(var r=0;r<hgt;r++){var yy=by+T-1-hgt+r+(interior?0:1);
            for(u=-r;u<=r;u++){var xx=cx+u;if(xx<0||xx>=T)continue;
              var cc=(snowy&&r<2)?C.snow:(u<0?C.rkl:u===0?C.rk2:C.rkd);put(bx+xx,yy,cc)}}
        }
      }
    }
    g.putImageData(img,0,0);
    if(TP){  /* drawn trees from props.png, back to front, rooted at the tile's bottom */
      var PR=ART.meta.sheets.props,pw=PR.celula[0],ph=PR.celula[1],an=PR.ancora;
      for(var ry=0;ry<H;ry++)for(var rx=0;rx<W;rx++){
        if(terrain[ry][rx]!=="2"||hash(rx,ry,73)>.42)continue;
        var pi=hash(rx,ry,70)<.5?1:0,jx=Math.floor(hash(rx,ry,71)*3)-1;
        g.drawImage(ART.img.props,pi*pw,0,pw,ph,rx*T+T/2-an[0]+jx,ry*T+T-1-an[1],pw,ph)}
    }
    terrFrames[f]=e;
  }
}

/* =====================================================================
   View
   ===================================================================== */
function resize(){var d=window.devicePixelRatio||1;
  /* The side panel ends above the minimap, whatever height the world's
     aspect gives it; otherwise the minimap covers the panel's bottom (and a
     chat panel's input box). */
  var mp=$("mini");if(mp&&mp.offsetHeight)$("right").style.bottom=(mp.offsetHeight+18)+"px";
  cv.width=Math.round(innerWidth*d);cv.height=Math.round(innerHeight*d);
  ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false;render()}
function fit(){scale=Math.max(2,Math.min(innerWidth/W,(innerHeight-40)/H));
  ox=(innerWidth-W*scale)/2;oy=(innerHeight-H*scale)/2;cache={};zlabel();render()}
function clampPan(){var mw=W*scale,mh=H*scale;
  ox=mw<innerWidth?(innerWidth-mw)/2:Math.min(0,Math.max(innerWidth-mw,ox));
  oy=mh<innerHeight?(innerHeight-mh)/2:Math.min(0,Math.max(innerHeight-mh,oy))}
function toTile(px,py){return{x:Math.floor((px-ox)/scale),y:Math.floor((py-oy)/scale)}}
function panTo(x,y){ox=innerWidth/2-(x+.5)*scale;oy=innerHeight/2-(y+.5)*scale;clampPan();render()}
function zoomAt(px,py,f){var t={x:(px-ox)/scale,y:(py-oy)/scale};
  var next=Math.max(2,Math.min(48,scale*f));ox=px-t.x*next;oy=py-t.y*next;scale=next;cache={};clampPan();zlabel();render()}
function zlabel(){var f=fitScale();$("zlabel").textContent=(scale/f).toFixed(1)+"×"}
function fitScale(){return Math.max(2,Math.min(innerWidth/W,(innerHeight-40)/H))}

function render(){
  if(!terrain||!terrFrames[0])return;
  trimCaches();
  ctx.fillStyle="#06090A";ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(terrFrames[frame],0,0,W*T,H*T,ox,oy,W*scale,H*scale);
  var x0=Math.max(0,Math.floor(-ox/scale)),x1=Math.min(W,Math.ceil((innerWidth-ox)/scale));
  var y0=Math.max(0,Math.floor(-oy/scale)),y1=Math.min(H,Math.ceil((innerHeight-oy)/scale));
  var s=Math.ceil(scale);
  if(layer!=="none"&&overlayRows){
    for(var y=y0;y<y1;y++)for(var x=x0;x<x1;x++){
      var v=overlayRows[y][x],fill=null,a=1;
      if(layer==="territory"){if(v>=0){fill=tribeColour(v);a=.30}}
      else if(layer==="fertility"){if(v>1.01){fill="#9BE07A";a=Math.min(.6,(v-1)*.5)}}
      else if(layer==="food"){if(v>0.02){fill="#F2CF6A";a=Math.min(.55,v*.55)}}
      if(fill){ctx.globalAlpha=a;ctx.fillStyle=fill;ctx.fillRect(Math.floor(ox+x*scale),Math.floor(oy+y*scale),s,s);ctx.globalAlpha=1}
    }
    if(layer==="territory"){ctx.lineWidth=Math.max(1,scale*.12);
      for(var y3=y0;y3<y1;y3++)for(var x3=x0;x3<x1;x3++){var o=overlayRows[y3][x3];if(o<0)continue;
        ctx.strokeStyle=tribeColour(o);var X=ox+x3*scale,Y=oy+y3*scale;ctx.beginPath();
        if(x3+1>=W||overlayRows[y3][x3+1]!==o){ctx.moveTo(X+scale,Y);ctx.lineTo(X+scale,Y+scale)}
        if(x3-1<0||overlayRows[y3][x3-1]!==o){ctx.moveTo(X,Y);ctx.lineTo(X,Y+scale)}
        if(y3+1>=H||overlayRows[y3+1][x3]!==o){ctx.moveTo(X,Y+scale);ctx.lineTo(X+scale,Y+scale)}
        if(y3-1<0||overlayRows[y3-1][x3]!==o){ctx.moveTo(X,Y);ctx.lineTo(X+scale,Y)}
        ctx.stroke()}}
  }
  if(lastState)drawEntities(lastState);
  if((tool||planting)&&hover)drawToolPreview();
  if(fx.length)drawFx();
  if(sel)drawSelection(sel.x,sel.y);
  drawMini();
}
function drawSelection(x,y){
  var X=ox+x*scale,Y=oy+y*scale,S=scale,l=Math.max(4,S*.32);
  ctx.strokeStyle=tok("--accent");ctx.lineWidth=Math.max(2,S*.12);ctx.beginPath();
  [[X,Y,1,1],[X+S,Y,-1,1],[X,Y+S,1,-1],[X+S,Y+S,-1,-1]].forEach(function(c){
    ctx.moveTo(c[0]+c[2]*l,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*l)});
  ctx.stroke();
}
var TOOLCOL={spawn:"#6dcb8e",bless:"#f5cd4a",blight:"#a08454",smite:"#ffe17a",plague:"#b994e6",heal:"#efe8d6"};
function drawToolPreview(){
  var r=planting?0:radius,c=planting?"#6fd3c4":TOOLCOL[tool]||"#fff";
  var X=ox+(hover.x-r)*scale,Y=oy+(hover.y-r)*scale,S=(2*r+1)*scale;
  ctx.globalAlpha=.14;ctx.fillStyle=c;ctx.fillRect(X,Y,S,S);ctx.globalAlpha=1;
  ctx.setLineDash([Math.max(3,scale*.3),Math.max(2,scale*.2)]);ctx.strokeStyle=c;ctx.lineWidth=1.5;
  ctx.strokeRect(X+.5,Y+.5,S-1,S-1);ctx.setLineDash([]);
}
function drawEntities(st){
  var grey="hsl(30 8% 55%)";
  var bs=Math.max(1,Math.round(scale/8));
  var L=st.settlementList,labels=[];
  for(var k=0;k<L.length;k+=4){
    var sx=ox+L[k]*scale,sy=oy+L[k+1]*scale;
    if(sx<-80||sy<-80||sx>innerWidth+80||sy>innerHeight+80)continue;
    var col=tribeColour(L[k+3])||grey;
    var sp=buildingSprite(L[k+2],col,bs,frame);
    ctx.drawImage(sp,Math.round(sx+scale/2-sp.width/2),Math.round(sy+scale-sp.height+bs));
    var info=civByXY[L[k]+","+L[k+1]];
    if(info&&scale>=13&&(L[k+2]>=1||scale>=22))labels.push([sx+scale/2,sy+scale+bs-buildingArtHeight(L[k+2])*bs-3,info.town,col,L[k+2]]);
  }
  var A=st.agents,stride=A.length%4===0?4:3,occ={};
  var small=scale<9,ps=Math.max(1,Math.round(scale/9));
  for(var j=0;j<A.length;j+=stride){
    var tx=A[j],ty=A[j+1],axp=ox+tx*scale,ayp=oy+ty*scale;
    if(axp<-20||ayp<-20||axp>innerWidth+20||ayp>innerHeight+20)continue;
    var key=tx+","+ty,n=occ[key]=(occ[key]||0)+1;
    var col2=tribeColour(A[j+2])||grey;
    var off=[[0,0],[-.22,-.1],[.22,-.1],[-.12,.18],[.12,.18]][(n-1)%5];
    if(small){
      var d=Math.max(2,Math.round(scale*.45));
      ctx.fillStyle="#16110d";ctx.fillRect(Math.round(axp+scale/2-d/2)-1,Math.round(ayp+scale/2-d/2)-1,d+2,d+2);
      ctx.fillStyle=col2;ctx.fillRect(Math.round(axp+scale/2-d/2),Math.round(ayp+scale/2-d/2),d,d);
      continue;
    }
    var look=stride===4?A[j+3]:1;
    /* Walk frames only for people who actually moved since the last snapshot
       (same slot in the array; a rare shuffle after a death just skips a step). */
    var moved=prevAgents&&prevAgents.length>j+1&&(prevAgents[j]!==tx||prevAgents[j+1]!==ty);
    var p=personSprite(look,col2,A[j+2],ps,ART.ok&&moved?1+((frame+j/stride)&1):0);
    var px=Math.round(axp+scale/2-p.width/2+off[0]*scale),py=Math.round(ayp+scale-p.height+off[1]*scale);
    ctx.globalAlpha=.28;ctx.fillStyle="#000";ctx.fillRect(px+ps,py+p.height-ps,p.width-2*ps,ps);ctx.globalAlpha=1;
    ctx.drawImage(p,px,py);
  }
  ctx.font="600 "+(scale>=24?11:10)+"px "+tok("--mono");ctx.textAlign="center";ctx.textBaseline="bottom";
  labels.forEach(function(l){
    var w=ctx.measureText(l[2]).width+12,h=15,x=Math.round(l[0]-w/2),y=Math.round(l[1]-h);
    ctx.fillStyle="rgba(10,14,12,.86)";ctx.fillRect(x,y,w,h);
    ctx.fillStyle=l[3];ctx.fillRect(x,y,3,h);
    ctx.fillStyle="#ECF1EA";ctx.fillText(l[2],l[0]+1,y+h-2);
  });
}
function drawMini(){
  if(!terrFrames[0])return;
  var mw=mini.width,mh=mini.height;
  mctx.imageSmoothingEnabled=true;mctx.drawImage(terrFrames[0],0,0,mw,mh);
  var sx=mw/W,sy=mh/H;
  if(lastState){var A=lastState.agents,st=A.length%4===0?4:3;
    for(var j=0;j<A.length;j+=st){var c=tribeColour(A[j+2]);if(!c)continue;
      mctx.fillStyle=c;mctx.fillRect(A[j]*sx,A[j+1]*sy,Math.max(1.5,sx),Math.max(1.5,sy))}
    var L=lastState.settlementList;mctx.fillStyle="#fff";
    for(var k=0;k<L.length;k+=4)mctx.fillRect(L[k]*sx-1,L[k+1]*sy-1,3,3)}
  var vx=-ox/scale*sx,vy=-oy/scale*sy,vw=innerWidth/scale*sx,vh=innerHeight/scale*sy;
  mctx.strokeStyle="#6FD3C4";mctx.lineWidth=1.5;mctx.strokeRect(Math.max(1,vx),Math.max(1,vy),Math.min(mw-2,vw),Math.min(mh-2,vh));
}

   Input
   ===================================================================== */
var dragging=false,moved=false,lastX=0,lastY=0;
cv.addEventListener("mousedown",function(e){dragging=true;moved=false;lastX=e.clientX;lastY=e.clientY;cv.classList.add("grabbing")});
addEventListener("mouseup",function(e){cv.classList.remove("grabbing");if(dragging&&!moved&&e.target===cv)handleClick(e);dragging=false});
addEventListener("mousemove",function(e){
  if(dragging){var dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
    ox+=dx;oy+=dy;lastX=e.clientX;lastY=e.clientY;clampPan();render();return}
  var tip=$("tip");
  if(e.target!==cv){tip.style.display="none";if(hover){hover=null;if(tool||planting)render()}return}
  var t=toTile(e.clientX,e.clientY);
  if(t.x<0||t.y<0||t.x>=W||t.y>=H){tip.style.display="none";hover=null;return}
  var changed=!hover||hover.x!==t.x||hover.y!==t.y;hover=t;
  var who=hoverName(t.x,t.y),terr=["Water","Grassland","Forest","Mountain"][+terrain[t.y][t.x]];
  tip.style.display="block";tip.style.left=(e.clientX+16)+"px";tip.style.top=(e.clientY+16)+"px";
  tip.innerHTML=(who?"<b>"+esc(who)+"</b>  ":"")+terr+"  <span style='color:var(--ink3)'>"+t.x+","+t.y+"</span>"+
    (tool?"  · <b style='color:"+TOOLCOL[tool]+"'>"+tool+"</b>":"")+(planting?"  · <b style='color:var(--accent)'>found here</b>":"");
  if(changed&&(tool||planting))render();
});
cv.addEventListener("mouseleave",function(){$("tip").style.display="none"});
cv.addEventListener("wheel",function(e){e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15)},{passive:false});
mini.addEventListener("click",function(e){var r=mini.getBoundingClientRect();
  panTo(Math.floor((e.clientX-r.left)/r.width*W),Math.floor((e.clientY-r.top)/r.height*H))});

function hoverName(x,y){
  if(!lastState)return "";
  var L=lastState.settlementList||[];
  for(var i=0;i<L.length;i+=4)if(L[i]===x&&L[i+1]===y){
    var c=civByXY[x+","+y];return c?c.town+" — "+c.name:"settlement"}
  return "";
}
function handleClick(e){
  var t=toTile(e.clientX,e.clientY);
  if(t.x<0||t.y<0||t.x>=W||t.y>=H)return;
  if(planting){
    var name=encodeURIComponent($("civName").value||"");
    var house=encodeURIComponent($("civHouse").value||"mix");
    var people=+$("civPeople").value||10;
    fetch("/found?x="+t.x+"&y="+t.y+"&name="+name+"&house="+house+"&people="+people)
      .then(function(r){return r.json()}).then(function(d){
        setTool(null);
        if(!d.ok){toast("system","Could not found",d.error||"");return}
        sel={x:d.x,y:d.y};panTo(d.x,d.y);inspect(d.x,d.y);
      });
    return;
  }
  if(tool){var used=tool,r=radius;addFx(used,t.x,t.y,r);
    fetch("/act?tool="+used+"&x="+t.x+"&y="+t.y+"&radius="+r)
    .then(function(res){return res.json()}).then(function(d){reportPower(used,t.x,t.y,d);if(layer!=="none")loadOverlay();poll()})
    .catch(function(){toast("system","Power failed","Could not reach the simulation.")});return}
  sel=t;inspect(t.x,t.y);render();
}
function inspect(x,y){showPane("insp");
  fetch("/inspect?x="+x+"&y="+y).then(function(r){return r.json()}).then(showInspect)}

/* ---- power feedback: visual effect on the map + toast + log line ---- */
var fx=[],animating=false,FXDUR=1200;
function addFx(t,x,y,r){fx.push({tool:t,x:x,y:y,r:r,t0:performance.now()});
  if(!animating){animating=true;requestAnimationFrame(fxTick)}}
function fxTick(){var now=performance.now();fx=fx.filter(function(f){return now-f.t0<FXDUR});
  render();if(fx.length)requestAnimationFrame(fxTick);else animating=false}
function drawFx(){var now=performance.now();
  fx.forEach(function(f){
    var p=Math.min(1,(now-f.t0)/FXDUR),q=1-p,col=TOOLCOL[f.tool]||"#fff";
    var X=ox+(f.x-f.r)*scale,Y=oy+(f.y-f.r)*scale,S=(2*f.r+1)*scale,cx=ox+(f.x+.5)*scale,cy=oy+(f.y+.5)*scale;
    var tint={bless:"#f5cd4a",blight:"#7a5a2a",smite:"#ff8a2a",plague:"#9a6ad8",heal:"#ffffff",spawn:"#6dcb8e"}[f.tool]||col;
    ctx.globalAlpha=.32*q;ctx.fillStyle=tint;ctx.fillRect(X,Y,S,S);
    ctx.globalAlpha=q;ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,scale*.14);
    ctx.beginPath();ctx.arc(cx,cy,Math.max(scale,S*.75*p),0,Math.PI*2);ctx.stroke();
    var n=12+f.r*5,sz=Math.max(2,Math.round(scale*.2)),seed=f.t0|0;
    for(var i=0;i<n;i++){
      var px=X+hash(i,seed,1)*S,py=Y+hash(i,seed,2)*S,dl=hash(i,seed,3)*.35,pp=Math.max(0,Math.min(1,(p-dl)/(1-dl)));
      if(pp<=0)continue;
      if(f.tool==="blight")py+=pp*scale*1.2;else if(f.tool==="plague"){px+=(px-cx)*pp*.4;py+=(py-cy)*pp*.4}else py-=pp*scale*1.8;
      ctx.globalAlpha=(1-pp);ctx.fillStyle=col;
      if(ART.ok&&(f.tool==="bless"||f.tool==="spawn"||f.tool==="plague")){
        var spk=propSprite(f.tool==="plague"?6:4,Math.max(1,Math.round(scale/12)));
        ctx.drawImage(spk,Math.round(px-spk.width/2),Math.round(py-spk.height/2))}
      else if(f.tool==="heal"){ctx.fillRect(px-sz,py-sz/3,sz*2,sz*.66);ctx.fillRect(px-sz/3,py-sz,sz*.66,sz*2)}
      else if(f.tool==="plague"){ctx.beginPath();ctx.arc(px,py,sz*(1+pp*1.5),0,Math.PI*2);ctx.fill()}
      else ctx.fillRect(px-sz/2,py-sz/2,sz,sz);
    }
    if(f.tool==="smite"&&p<.4){var k=1-p/.4,fl=Math.floor(now/45);
      ctx.globalAlpha=.22*k;ctx.fillStyle="#fff6c8";ctx.fillRect(0,0,innerWidth,innerHeight);
      ctx.globalAlpha=k;ctx.beginPath();var bx=cx,by=Math.max(0,cy-innerHeight*.6);ctx.moveTo(bx,by);
      for(var sgi=1;sgi<=8;sgi++){var tt=sgi/8;ctx.lineTo(cx+(sgi<8?(hash(sgi,fl,5)-.5)*scale*2.2:0),by+(cy-by)*tt)}
      ctx.strokeStyle="#ffe17a";ctx.lineWidth=Math.max(4,scale*.35);ctx.stroke();
      ctx.strokeStyle="#ffffff";ctx.lineWidth=Math.max(2,scale*.14);ctx.stroke();
      if(ART.ok){var bolt=propSprite(5,Math.max(2,Math.round(scale/6)));
        ctx.drawImage(bolt,Math.round(cx-bolt.width/2),Math.round(cy-bolt.height+scale/2))}}
    ctx.globalAlpha=1;
  });
}
function reportPower(t,x,y,d){

  var n=d.affected||0,msg;
  if(t==="bless")msg=n?n+" tiles flourished — farmland improved and food restored. See it on the Farm and Food layers.":"No land here could be blessed.";
  else if(t==="blight")msg=n?n+" tiles withered — food and farmland wiped out.":"No land here to blight.";
  else if(t==="smite")msg=n?n+(n===1?" person":" people")+" struck down by fire from the sky.":"The fire fell on empty ground.";
  else if(t==="plague")msg=n?"A disease was loosed on one person. Crowds will spread it.":"Nobody here could catch anything — no one in range, or all immune.";
  else if(t==="heal")msg=n?n+(n===1?" person":" people")+" restored: healed, fed, rested and cured.":"Nobody in range to heal.";

  var label=TOOLS[t]?TOOLS[t][0]:t;

  addLog([{d:lastDay<0?0:lastDay,k:"power",m:label+" at ("+x+", "+y+"): "+msg}]);

  lastToast[msg]=now;

  var c=KIND[kind]?tok(KIND[kind][0]):tok("--accent"),t=document.createElement("div");

  var sorted=rows.slice().sort(function(a,b){return b.pop-a.pop});
  el.innerHTML=sorted.map(function(t){var col=tribeColour(t.color)||"#888";
    return '<div class="card click" data-x="'+t.x+'" data-y="'+t.y+'"><div class="ttl"><span class="strip" style="background:'+col+'"></span>'+
      '<div style="flex:1;min-width:0"><span class="name">'+esc(t.name)+'</span>'+badge(t.house)+
      '<div class="meta">'+t.pop+' people'+(t.era?' · '+esc(t.era):'')+(t.town?' · '+esc(t.town):' · nomadic')+'</div>'+
      bar(t.pop/max*100,col)+(t.inventing?'<div class="meta" style="color:var(--invention)">crafting '+esc(t.inventing)+'</div>':'')+'</div></div></div>'}).join("");
  bindJump(el);
}
var lastMindSig="";
function showMinds(ai){
  if(unchanged("minds",ai))return;
  var el=$("minds");
  if(!ai){el.innerHTML='<div class="empty">No AI state.</div>';return}
  if(!ai.available){
    el.innerHTML='<div class="empty"><img class="px" alt="" src="'+iconURL("mind",4)+'" style="width:36px;height:36px"><div class="big">Minds are asleep.</div>'+
      'Tribes are running on instinct (utility rules). Put <span class="mono">'+esc(ai.key||"DEEPSEEK_API_KEY")+'</span> and/or <span class="mono">'+
      esc(ai.openaiKey||"OPENAI_API_KEY")+'</span> in <span class="mono">.env</span> to hand the largest tribes to an LLM &mdash; or, for free, '+
      '<span class="mono">LLM_BASE_URL</span> + <span class="mono">LLM_MODEL</span> (Groq, Gemini, OpenRouter, a local Ollama) or <span class="mono">LLM_BASE_URL=mock</span> for offline rules.</div>';return}
  var rows=ai.tribes||[];
  var sig=rows.map(function(t){return t.id+t.stance+t.intent}).join("|");
  if(sig!==lastMindSig&&lastMindSig&&activePane!=="minds")$("dotMinds").classList.add("show");lastMindSig=sig;
  if(!rows.length){el.innerHTML='<div class="empty">Waiting for tribes to form, or plant one yourself.</div>';return}
  var u=ai.usage||{},tokTotal=(u.tokens_in||0)+(u.tokens_out||0);
  var usageLine='<div class="card" style="font-family:var(--mono);font-size:10.5px;color:var(--ink2)">'+
    (u.paused?'<div style="color:var(--warn);margin-bottom:4px">LLM calls are OFF — tribes keep their last decisions. Press <span class="kbd">M</span> or the AI button to resume.</div>':'')+
    (u.halted?'<div style="color:var(--bad);margin-bottom:4px">Minds stopped: '+esc(u.halted)+'</div>':'')+
    'API calls <b style="color:var(--ink)">'+(u.calls||0)+'</b> · '+(u.per_minute||0)+'/'+(u.cap!=null?u.cap:'?')+' per min · skipped '+(u.skipped||0)+
    ' · failed '+(u.failures||0)+'<br>tokens '+tokTotal.toLocaleString()+' (in '+(u.tokens_in||0).toLocaleString()+
    ', out '+(u.tokens_out||0).toLocaleString()+(u.tokens_cached?', cached '+u.tokens_cached.toLocaleString():'')+')'+
    '<div class="aictl"><button data-ai="'+(u.paused?'on':'off')+'">'+(u.paused?'Turn AI on':'Turn AI off')+'</button>'+
    '<span>cap</span><button data-ai="cap-">−</button><b style="color:var(--ink)">'+(u.cap!=null?u.cap:'?')+'</b><button data-ai="cap+">+</button><span>/min</span>'+
    '<button data-ai="forget" title="Drop every policy: tribes play by the plain rules until they think again">Forget decisions</button></div></div>';
  el.innerHTML=usageLine+'<div class="sub" style="margin-bottom:8px">'+(ai.thinking?ai.thinking+" thinking · ":"")+ai.minds+' minds live</div>'+
    rows.map(function(t){var col=tribeColour(t.color)||"#888";
    var st=t.thinking?'<span class="meta" style="font-style:italic">thinking…</span>':t.stance?'<span class="stance">'+esc(t.stance)+'</span>':t.error?'':'<span class="meta">waiting</span>';
    return '<div class="card click" data-x="'+t.x+'" data-y="'+t.y+'"><div class="ttl"><span class="strip" style="background:'+col+'"></span><div style="flex:1">'+
      '<span class="name">'+esc(t.name)+'</span>'+badge(t.house)+' '+st+
      (t.intent?'<div class="quote">“'+esc(t.intent)+'”</div>':'')+(t.error?'<div class="meta" style="color:var(--bad)">'+esc(t.error)+'</div>':'')+
      (t.inventing?'<div class="meta" style="color:var(--invention)">crafting '+esc(t.inventing)+'</div>':'')+'</div></div></div>'}).join("");
  bindJump(el);
}
function showDiscoveries(items){
  if(unchanged("disc",[items,colorByName]))return;
  var el=$("disc");
  if(!items||!items.length){el.innerHTML='<div class="empty"><img class="px" alt="" src="'+iconURL("bulb",4)+'" style="width:36px;height:36px"><div class="big">Nothing invented yet.</div>Research comes from people, food and scholars. Fire usually comes first.</div>';return}
  if(items.length>seenDisc&&activePane!=="disc"&&booted)$("dotDisc").classList.add("show");
  if(activePane==="disc")seenDisc=items.length;
  el.innerHTML=items.slice().reverse().map(function(d){var col=colorByName[d.tribe]!==undefined?tribeColour(colorByName[d.tribe]):"#888";
    return '<div class="card disc"><div class="ttl"><img class="px" alt="" src="'+iconURL("bulb")+'" style="width:18px;height:18px"><span class="name">'+esc(d.name)+'</span>'+
      (d.custom?'<span class="badge chief">new craft</span>':'')+'</div>'+
      '<div class="meta"><span class="swatch" style="display:inline-block;width:7px;height:7px;border-radius:2px;background:'+col+';margin-right:5px"></span>'+esc(d.tribe)+' · Year '+d.year+(d.era?' · '+esc(d.era):'')+'</div>'+
      (d.why?'<div class="why">'+esc(d.why)+'</div>':'')+'</div>'}).join("");
}
$("explain").addEventListener("click",function(){
  var el=$("aiBody");el.innerHTML='<p class="hint">Writing…</p>';
  fetch("/explain").then(function(r){return r.json()}).then(function(d){
    if(!d.ok){el.innerHTML='<p class="hint">'+esc(d.error)+'</p>';return}
    el.innerHTML='<div class="section">To year '+d.year+'</div>'+d.text.split(/\n+/).map(function(p){
      return "<p>"+esc(p.replace(/\*\*/g,"").replace(/^#+\s*/,""))+"</p>"}).join("")})
  .catch(function(){el.innerHTML='<p class="hint">Could not reach the simulation.</p>'})});

/* ---- extension panels: logic lives outside the game (LiveState.add_extension) ---- */
var WB_TOKEN="__WB_TOKEN__",chats={};
function extFetch(path,body){
  var opt={headers:{"X-Worldbox-Token":WB_TOKEN}};
  if(body!==undefined){opt.method="POST";opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  return fetch(path,opt).then(function(r){return r.json()});
}
function loadExtensions(){
  extFetch("/ext").then(function(d){(d.extensions||[]).forEach(function(x){if(x.kind==="chat")addChat(x)})}).catch(function(){});
}
function addChat(x){
  var id=x.id,tab=document.createElement("button");
  tab.className="tab";tab.dataset.pane="ext_"+id;
  tab.innerHTML=esc(x.title||id)+'<span class="dot" id="dot_'+id+'"></span>';
  var hist=document.querySelector('.tab[data-pane="hist"]');hist.parentNode.insertBefore(tab,hist);
  tab.addEventListener("click",function(){showPane(tab.dataset.pane);$("dot_"+id).classList.remove("show");scrollChat(id)});
  var pane=document.createElement("div");pane.className="pane chatpane";pane.id="ext_"+id;
  pane.innerHTML=(x.subtitle?'<div class="chatsub">'+esc(x.subtitle)+'</div>':'')+
    '<div class="chatlog" id="log_'+id+'"></div>'+
    '<form class="chatin" id="form_'+id+'"><input id="in_'+id+'" maxlength="'+(x.maxLength||600)+'" placeholder="'+esc(x.placeholder||"Say something…")+'" autocomplete="off">'+
    '<button type="submit">Send</button></form>';
  $("right").appendChild(pane);
  chats[id]={since:-1,seen:{}};
  $("form_"+id).addEventListener("submit",function(e){e.preventDefault();
    var inp=$("in_"+id),text=inp.value.trim();if(!text)return;inp.value="";
    extFetch("/ext/"+id+"/send",{text:text}).then(function(d){if(d&&d.ok===false)toast("system",x.title||id,d.error||"Not sent.");pollChat(id)})
      .catch(function(){toast("system",x.title||id,"Could not reach the game.")})});
  pollChat(id);setInterval(function(){if(!document.hidden)pollChat(id)},1000);
}
function scrollChat(id){var l=$("log_"+id);if(l)l.scrollTop=l.scrollHeight}
function pollChat(id){var c=chats[id];
  return extFetch("/ext/"+id+"/messages?since="+c.since).then(function(d){if(!d||!d.ok)return;
    var log=$("log_"+id),stick=log.scrollTop+log.clientHeight>=log.scrollHeight-20,fresh=false;
    (d.messages||[]).forEach(function(m){
      var el=c.seen[m.id];
      if(!el){el=document.createElement("div");c.seen[m.id]=el;log.appendChild(el);if(m.role==="character")fresh=true}
      el.className="msg "+(m.role||"system")+(m.pending?" pending":"");
      el.innerHTML=(m.role!=="system"&&m.name?'<span class="who">'+esc(m.name)+(m.day!=null?' · '+fmtDay(m.day):'')+'</span>':'')+esc(m.text||(m.pending?"…":""));
      if(!m.pending&&m.id>c.since)c.since=m.id;
    });
    if(fresh&&activePane!=="ext_"+id)$("dot_"+id).classList.add("show");
    if(stick||fresh)scrollChat(id);
  }).catch(function(){});
}

/* ---- data ---- */
function loadOverlay(){fetch("/overlay?kind="+layer).then(function(r){return r.json()}).then(function(d){overlayRows=d.rows;render()})}
var rateHist=[];
function showRate(s){
  var now=performance.now();rateHist.push([now,s.day]);
  while(rateHist.length>2&&now-rateHist[0][0]>4000)rateHist.shift();
  var a=rateHist[0],el=$("rate");
  if(!s.running){el.textContent="paused";return}
  if(now-a[0]<900){return}
  el.textContent=((s.day-a[1])/((now-a[0])/1000)).toFixed(1)+" d/s";
}
var prevAgents=null;
function poll(){return fetch("/state?since="+lastDay).then(function(r){return r.json()}).then(function(s){
  prevAgents=lastState?lastState.agents:null;
  lastDay=s.day;running=s.running;lastState=s;showRate(s);
  quick(s);addLog(s.log);booted=true;frame=1-frame;render();
}).catch(function(){})}

document.querySelectorAll(".tb[data-ico]").forEach(function(b){b.querySelector("img").src=iconURL(b.dataset.ico)});
addEventListener("resize",function(){resize();clampPan();render()});
/* Drawn sheets load first (or fail fast to the generated art), so the very
   first frame, legend and portraits already use the right sprites. */
loadArt().then(function(){return fetch("/world")}).then(function(r){return r.json()}).then(function(w){
  W=w.width;H=w.height;terrain=w.terrain;
  mini.width=W*3;mini.height=H*3;
  fillHouses(w.houses||[]);buildTerrain();
  /* The highlighted speed button is what the player sees, so make the server
     match it; otherwise a fresh server runs at its own default (0.12 s) while
     the page claims 1x. */
  var onSpeed=SPEEDS.filter(function(b){return b.classList.contains("on")})[0];
  if(onSpeed)fetch("/control?action=speed&value="+onSpeed.dataset.delay);
  resize();fit();emptyInspect();poll();setInterval(poll,500);loadExtensions();
  setInterval(function(){if(layer!=="none")loadOverlay()},4000);
});
})();
</script></body></html>
